<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de PDF</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <link rel="icon" type="image/x-icon" href="pdf.ico">
    <!-- 1. SVG para navegadores modernos (vectorial y escalable) -->
    <link rel="icon" type="image/svg+xml" href="img/pdf.svg">

    <!-- 2. PNG de alta resolución (p. ej. 32x32) como fallback estándar -->
    <link rel="icon" type="image/png" sizes="32x32" href="img/pdf.png">

    <!-- 3. PNG para la pantalla de inicio de iOS/Safari (180x180) -->
    <link rel="apple-touch-icon" href="img/apple-touch-icon-pdf.png">

    <!-- 4. ICO únicamente para compatibilidad legacy (en la raíz del servidor) -->
    <link rel="shortcut icon" href="img/pdf.ico">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>📄 Visor de PDF</h1>
            <div class="upload-section">
                <input type="file" id="fileInput" accept=".pdf">
                <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
                    Seleccionar PDF
                </button>
            </div>
        </div>

        <div class="controls">
            <button id="prevPage" disabled>← Anterior</button>
            <span class="page-info">
                Página: <span id="pageNum">-</span> / <span id="pageCount">-</span>
            </span>
            <button id="nextPage" disabled>Siguiente →</button>

            <div class="zoom-controls">
                <button id="zoomOut" disabled>−</button>
                <select id="zoom" disabled>
                    <option value="0.5">50%</option>
                    <option value="0.75">75%</option>
                    <option value="1" selected>100%</option>
                    <option value="1.25">125%</option>
                    <option value="1.5">150%</option>
                    <option value="2">200%</option>
                </select>
                <button id="zoomIn" disabled>+</button>
            </div>
        </div>

        <div class="canvas-container">
            <div class="placeholder" id="placeholder">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                <p>Selecciona un archivo PDF para comenzar</p>
            </div>
            <canvas id="pdfCanvas"></canvas>
        </div>
    </div>

    <script src="js/index.js"></script>
</body>

</html>
